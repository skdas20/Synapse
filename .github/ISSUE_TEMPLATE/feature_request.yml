name: Feature request
description: Suggest an idea for Synapse
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like Synapse to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this
