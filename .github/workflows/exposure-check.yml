name: Exposure check

# Daily check that the live site does not serve .env files, .git folders,
# keys or backups. https://github.com/skdas20/exposure-check
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exposure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: skdas20/exposure-check@v0
        with:
          urls: https://synapse-av8e.onrender.com
          timeout: "60000"

